<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — Kaveri Restaurant Group Ranchi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body.auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 10% 20%, rgba(117, 23, 30, 0.45) 0%, transparent 50%),
                  radial-gradient(circle at 90% 80%, rgba(197, 155, 39, 0.25) 0%, transparent 50%),
                  #181213;
      font-family: 'Plus Jakarta Sans', sans-serif;
      padding: 30px 16px;
    }
    .auth-card-wrapper {
      width: 100%;
      max-width: 520px;
    }
    .auth-card {
      background: rgba(37, 27, 29, 0.92);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(197, 155, 39, 0.35);
      border-radius: 28px;
      padding: 44px 38px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.7);
    }
    .auth-brand {
      font-family: 'Cinzel', serif;
      font-size: 2.2rem;
      font-weight: 800;
      color: #ffffff;
      text-align: center;
      margin-bottom: 2px;
      letter-spacing: 0.05em;
    }
    .auth-tagline {
      font-size: 0.75rem;
      color: var(--gold-light);
      text-align: center;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 28px;
    }
    .form-floating label {
      color: rgba(255, 255, 255, 0.6);
      font-size: 0.9rem;
    }
    .form-floating > .form-control {
      background: rgba(255, 255, 255, 0.08);
      border: 1.5px solid rgba(197, 155, 39, 0.3);
      color: #ffffff;
      border-radius: 14px;
      height: 58px;
      font-size: 0.95rem;
    }
    .form-floating > .form-control:focus {
      background: rgba(255, 255, 255, 0.14);
      border-color: var(--gold);
      box-shadow: 0 0 0 4px rgba(197, 155, 39, 0.25);
      color: #ffffff;
    }
    .btn-auth-submit {
      background: var(--gold-gradient);
      border: none;
      color: #ffffff;
      border-radius: 9999px;
      padding: 14px;
      font-weight: 700;
      font-size: 1rem;
      width: 100%;
      box-shadow: var(--shadow-gold);
      transition: all 0.3s ease;
    }
    .btn-auth-submit:hover {
      filter: brightness(1.1);
      transform: translateY(-2px);
      color: #ffffff;
    }
    .auth-alert-error {
      background: rgba(211, 47, 47, 0.2);
      border: 1px solid rgba(211, 47, 47, 0.4);
      border-radius: 12px;
      color: #ff8a80;
      padding: 12px 16px;
      font-size: 0.88rem;
      display: none;
    }
  </style>
</head>
<body class="auth-page">

<div class="auth-card-wrapper">
  <div class="text-center mb-4">
    <a href="/" class="text-decoration-none">
      <img src="/images/logo.png" alt="Kaveri" style="height:54px; margin-bottom:10px;" onerror="this.style.display='none'">
      <div class="auth-brand">KAVERI</div>
      <div class="auth-tagline">Restaurant Group · Ranchi · Est. 1947</div>
    </a>
  </div>

  <div class="auth-card">
    <h4 class="text-white text-center fw-bold mb-1" style="font-family:'Playfair Display', serif;">Join Kaveri Club</h4>
    <p class="text-center text-white-50 small mb-4">Create an account to book tables and order sweets & delicacies.</p>

    <!-- Error Alert -->
    <div class="auth-alert-error mb-3" id="regError">
      <i class="fas fa-exclamation-circle me-2"></i><span id="regErrorMsg">Registration failed.</span>
    </div>

    <!-- Form -->
    <form id="regForm" novalidate>
      <div class="form-floating mb-3">
        <input type="text" class="form-control" id="regName" placeholder="Full Name" required>
        <label for="regName"><i class="far fa-user me-2"></i>Full Name</label>
      </div>

      <div class="form-floating mb-3">
        <input type="email" class="form-control" id="regEmail" placeholder="name@example.com" required autocomplete="email">
        <label for="regEmail"><i class="far fa-envelope me-2"></i>Email Address</label>
      </div>

      <div class="form-floating mb-3">
        <input type="tel" class="form-control" id="regPhone" placeholder="+91 9876543210" required>
        <label for="regPhone"><i class="fas fa-phone me-2"></i>Phone Number</label>
      </div>

      <div class="form-floating mb-3">
        <input type="password" class="form-control" id="regPassword" placeholder="Password (min 8 chars)" required>
        <label for="regPassword"><i class="fas fa-lock me-2"></i>Password (min 8 characters)</label>
      </div>

      <button type="submit" class="btn-auth-submit mb-4" id="regBtn">
        <span id="regBtnText"><i class="fas fa-user-plus me-2"></i>Create Account</span>
        <span id="regSpinner" style="display:none;"><span class="spinner-border spinner-border-sm me-2"></span>Registering...</span>
      </button>

      <hr style="border-color: rgba(255,255,255,0.15);">
      <p class="text-center text-white-50 small mb-0">
        Already have an account? <a href="/login.html" class="text-gold fw-bold text-decoration-none ms-1">Sign In</a>
      </p>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/main.js"></script>
<script>
  document.getElementById('regForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const name = document.getElementById('regName').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const phone = document.getElementById('regPhone').value.trim();
    const password = document.getElementById('regPassword').value;
    const errDiv = document.getElementById('regError');
    const errMsg = document.getElementById('regErrorMsg');
    const btnText = document.getElementById('regBtnText');
    const spinner = document.getElementById('regSpinner');

    errDiv.style.display = 'none';

    if (!name || !email || !password) {
      errMsg.textContent = 'Please fill in all required fields.';
      errDiv.style.display = 'block';
      return;
    }

    btnText.style.display = 'none';
    spinner.style.display = 'inline';
    document.getElementById('regBtn').disabled = true;

    try {
      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, phone, password })
      });

      const responseData = await res.json();

      if (res.ok && responseData.data && responseData.data.token) {
        Auth.save(responseData.data);
        Toast.success('Welcome to Kaveri Restaurant Group, ' + responseData.data.name + '!');
        setTimeout(() => { window.location.href = '/'; }, 600);
      } else {
        errMsg.textContent = responseData.message || 'Registration failed. Email may already be in use.';
        errDiv.style.display = 'block';
      }
    } catch (err) {
      errMsg.textContent = 'Could not reach server. Please check connection.';
      errDiv.style.display = 'block';
    } finally {
      btnText.style.display = 'inline';
      spinner.style.display = 'none';
      document.getElementById('regBtn').disabled = false;
    }
  });
</script>
</body>
</html>
