# ==========================================
# Kaveri Restaurant Group - Local H2 Profile
# For zero-config running without MySQL
# ==========================================

spring.application.name=KaveriRestaurant
server.port=8080
server.servlet.context-path=/

# ---- In-Memory H2 Database ----
spring.datasource.url=jdbc:h2:mem:kaveridb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---- JPA / Hibernate for H2 ----
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---- H2 Console ----
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ---- JWT ----
app.jwt.secret=kaveri-super-secret-key-for-jwt-signing-must-be-at-least-256-bits-long-est-1947
app.jwt.expiration=86400000

# ---- Razorpay (Sandbox / Dev) ----
razorpay.key.id=your_razorpay_key_id
razorpay.key.secret=your_razorpay_key_secret
razorpay.mock.enabled=true
razorpay.webhook.secret=

# ---- CORS ----
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}

# ---- Rate Limiting ----
security.ratelimit.enabled=true
security.ratelimit.auth.limit=10
security.ratelimit.payment.limit=15
security.ratelimit.general.limit=120

# ---- Meta WhatsApp Business Cloud API ----
whatsapp.mock.enabled=true
whatsapp.api.token=
whatsapp.api.phone-number-id=
whatsapp.webhook.verify-token=kaveri_whatsapp_verify_token_est1947
whatsapp.webhook.app-secret=
whatsapp.restaurant.phone=918235520520
whatsapp.restaurant.name=Kaveri Restaurant Kitchen

# ---- Spring Boot Actuator ----
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ---- File Upload ----
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=uploads

# ---- Swagger / OpenAPI ----
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ---- Logging ----
logging.level.com.kaveri=INFO
logging.level.org.springframework.security=WARN
logging.level.root=WARN

# ---- Restaurant Order & Billing Settings ----
app.tax.rate=0.05
app.delivery.fee=40.00
app.delivery.free-above=500.00
