# ==========================================
# Kaveri / FoodNest Local H2 Profile
# For zero-config running without MySQL
# ==========================================

spring.application.name=FoodNest
server.port=8080
server.servlet.context-path=/

# ---- In-Memory H2 Database with MySQL Compatibility ----
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---- JPA / Hibernate for H2 ----
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---- H2 Console ----
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ---- JWT ----
app.jwt.secret=foodnest-super-secret-key-for-jwt-signing-must-be-at-least-256-bits-long
app.jwt.expiration=86400000

# ---- Razorpay ----
razorpay.key.id=your_razorpay_key_id
razorpay.key.secret=your_razorpay_key_secret

# ---- File Upload ----
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=uploads

# ---- Swagger / OpenAPI ----
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ---- Thymeleaf ----
spring.thymeleaf.enabled=false
spring.thymeleaf.check-template-location=false

# ---- Logging ----
logging.level.com.foodnest=DEBUG
logging.level.org.springframework.security=WARN
logging.level.root=WARN

# ---- Tax & Delivery ----
app.tax.rate=0.05
app.delivery.fee=40.00
app.delivery.free-above=500.00
