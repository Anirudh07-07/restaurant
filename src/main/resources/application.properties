# ==========================================
# Kaveri Restaurant Group - Application Config
# Ranchi, Jharkhand (EST. 1947)
# ==========================================

spring.profiles.active=dev
spring.application.name=KaveriRestaurant

# ---- Server ----
server.port=${PORT:8080}
server.servlet.context-path=/
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ---- Database (PostgreSQL / MySQL / H2) ----
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/kaveridb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}

# ---- HikariCP Connection Pool ----
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---- JWT ----
app.jwt.secret=${JWT_SECRET:kaveri-super-secret-key-for-jwt-signing-must-be-at-least-256-bits-long-est-1947}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# ---- CORS ----
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080,https://thekaveri.com,https://www.thekaveri.com}

# ---- Rate Limiting ----
security.ratelimit.enabled=${RATELIMIT_ENABLED:true}
security.ratelimit.auth.limit=10
security.ratelimit.payment.limit=15
security.ratelimit.general.limit=120

# ---- Razorpay Payment Gateway ----
razorpay.key.id=${RAZORPAY_KEY_ID:your_razorpay_key_id}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:your_razorpay_key_secret}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}
razorpay.mock.enabled=${RAZORPAY_MOCK_ENABLED:true}

# ---- Meta WhatsApp Business Cloud API ----
whatsapp.api.token=${WHATSAPP_API_TOKEN:}
whatsapp.api.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.api.version=${WHATSAPP_API_VERSION:v20.0}
whatsapp.api.base-url=${WHATSAPP_BASE_URL:https://graph.facebook.com}
whatsapp.webhook.verify-token=${WHATSAPP_WEBHOOK_VERIFY_TOKEN:kaveri_whatsapp_verify_token_est1947}
whatsapp.webhook.app-secret=${WHATSAPP_APP_SECRET:}
whatsapp.restaurant.phone=${WHATSAPP_RESTAURANT_PHONE:918235520520}
whatsapp.restaurant.name=${WHATSAPP_RESTAURANT_NAME:Kaveri Restaurant Kitchen}
whatsapp.mock.enabled=${WHATSAPP_MOCK_ENABLED:true}

# ---- Spring Boot Actuator ----
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ---- File Upload ----
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=${UPLOAD_DIR:uploads}

# ---- Swagger / OpenAPI ----
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ---- Logging ----
logging.level.com.kaveri=DEBUG
logging.level.org.springframework.security=WARN
logging.level.root=WARN

# ---- Restaurant Order & Billing Settings ----
app.tax.rate=0.05
app.delivery.fee=40.00
app.delivery.free-above=500.00
