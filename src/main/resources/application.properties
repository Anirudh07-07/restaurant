# ======================================
# FoodNest Application Properties (DEV)
# ======================================

spring.profiles.active=dev
spring.application.name=FoodNest

# ---- Server ----
server.port=8080
server.servlet.context-path=/

# ---- Database ----
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/foodnest?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ---- JWT ----
app.jwt.secret=${JWT_SECRET:foodnest-super-secret-key-for-jwt-signing-must-be-at-least-256-bits-long}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# ---- Razorpay ----
razorpay.key.id=${RAZORPAY_KEY_ID:your_razorpay_key_id}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:your_razorpay_key_secret}

# ---- File Upload ----
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=${UPLOAD_DIR:uploads}

# ---- Swagger / OpenAPI ----
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ---- Thymeleaf ----
spring.thymeleaf.enabled=false
spring.thymeleaf.check-template-location=false

# ---- Logging ----
logging.level.com.foodnest=DEBUG
logging.level.org.springframework.security=WARN
logging.level.root=WARN

# ---- Tax & Delivery ----
app.tax.rate=0.05
app.delivery.fee=40.00
app.delivery.free-above=500.00
