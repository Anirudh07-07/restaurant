# ==========================================
# Kaveri Test Profile Configuration
# Uses H2 in-memory database for tests
# ==========================================

spring.application.name=KaveriRestaurant
spring.datasource.url=jdbc:h2:mem:kaveri_testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

app.jwt.secret=test-jwt-secret-key-for-testing-purposes-minimum-256-bits-aaabbbccc
app.jwt.expiration=3600000

app.cors.allowed-origins=http://localhost:8080,http://127.0.0.1:8080

razorpay.key.id=test_key_id
razorpay.key.secret=test_key_secret
razorpay.webhook.secret=test_webhook_secret
razorpay.mock.enabled=true

whatsapp.mock.enabled=true
whatsapp.webhook.verify-token=test_verify_token
whatsapp.webhook.app-secret=test_app_secret
whatsapp.restaurant.phone=918235520520
whatsapp.restaurant.name=Kaveri Test Kitchen

security.ratelimit.enabled=false
security.ratelimit.auth.limit=10
security.ratelimit.payment.limit=15
security.ratelimit.general.limit=120

app.tax.rate=0.05
app.delivery.fee=40.00
app.delivery.free-above=500.00
