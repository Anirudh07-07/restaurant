# ==============================================================
# Production Nginx Configuration for Kaveri Restaurant Platform
# ==============================================================

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Client body limit (align with Spring Boot 5MB upload limit)
    client_max_body_size 10M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Rate Limiting Zones
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

    # Upstream to Spring Boot container
    upstream backend_app {
        server app:8080;
        keepalive 32;
    }

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name thekaveri.com www.thekaveri.com;
        return 301 https://$host$request_uri;
    }

    # HTTPS Server
    server {
        listen 443 ssl http2;
        server_name thekaveri.com www.thekaveri.com;

        # SSL Certificates (managed via Let's Encrypt / Certbot)
        ssl_certificate /etc/letsencrypt/live/thekaveri.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/thekaveri.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Proxy standard headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Auth Endpoints (Rate limited)
        location /api/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://backend_app;
        }

        # Payment Endpoints
        location /api/payments/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://backend_app;
        }

        # General API Endpoints
        location /api/ {
            limit_req zone=general_limit burst=20 nodelay;
            proxy_pass http://backend_app;
        }

        # Actuator Probes (Internal or Prometheus)
        location /actuator/health {
            proxy_pass http://backend_app;
        }

        # Static assets with caching
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|svg)$ {
            proxy_pass http://backend_app;
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }

        # Default catch-all
        location / {
            proxy_pass http://backend_app;
        }
    }
}

